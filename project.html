<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Detail — ARSHAVIN®</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Italianno&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.detail{padding:55px 0 80px;max-width:1100px;margin:auto}.back{font:11px 'DM Mono';letter-spacing:.12em;color:#aaa}.detail-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:45px 0 25px}.detail-title{font-size:clamp(44px,9vw,110px);letter-spacing:-.08em;line-height:.9;margin:0}.detail-cover{height:min(58vw,570px);min-height:280px;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;overflow:hidden}.detail-cover .art-logo{font-size:250px}.detail-cover .art-nosleep{font-size:clamp(80px,16vw,200px)}.detail-cover .art-type{font-size:clamp(90px,15vw,180px)}.detail-cover .art-moment span{font-size:250px}.detail-cover img{width:100%;height:100%;object-fit:cover}.detail-info{display:grid;grid-template-columns:1fr 2fr;gap:30px;padding:35px 0;border-bottom:1px solid #444}.detail-info h3{font:11px 'DM Mono';letter-spacing:.15em}.detail-info p{color:#aaa;line-height:1.9;margin:0}@media(max-width:600px){.detail{padding-top:30px}.detail-head{align-items:start;flex-direction:column}.detail-info{grid-template-columns:1fr;gap:10px}}</style></head><body><div class="grain"></div><header class="nav"><a class="brand-mark" href="index.html">A<span>®</span></a><nav><a href="index.html#home">HOME</a><a class="active" href="index.html#works">WORKS</a><a href="index.html#about">ABOUT</a><a href="index.html#contact">CONTACT</a></nav><div class="nav-right"><button id="themeToggle" class="icon-btn">☾</button><i class="divider"></i><span class="availability">DESIGN PORTFOLIO <b></b></span></div></header><main class="wrap detail"><a class="back" href="index.html#works">← BACK TO WORKS</a><div id="detail"></div></main><footer class="footer wrap"><span>© 2026 ARSHAVIN® DESIGN STUDIO.</span><div><a href="index.html#contact">CONTACT</a> / <a href="admin.html">ADMIN ↗</a></div></footer><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id'),p=readProjects().find(x=>x.id===id),root=document.getElementById('detail');if(!p)root.innerHTML='<h1>Project not found.</h1><a class="text-link" href="index.html#works">KEMBALI KE KARYA ⟶</a>';else root.innerHTML=`<div class="detail-head"><div><p class="eyebrow">${escapeHtml(p.category)} / ${escapeHtml(p.year)}</p><h1 class="detail-title">${escapeHtml(p.title)}</h1></div><p class="mono muted">PROJECT — ${escapeHtml(p.id).toUpperCase()}</p></div><div class="detail-cover">${artMarkup(p)}</div><div class="detail-info"><h3>ABOUT THE PROJECT</h3><p>${escapeHtml(p.desc||'Deskripsi belum ditambahkan.')}</p></div><div class="detail-info"><h3>ROLE / CATEGORY</h3><p>${escapeHtml(p.category)} · Concept development · Visual exploration</p></div><a class="text-link" href="index.html#contact">PUNYA PROYEK SERUPA? <span>⟶</span></a>`;</script></body></html>
