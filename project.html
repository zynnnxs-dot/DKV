<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Detail — GITS STORE®</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Italianno&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.detail{padding:55px 0 80px;max-width:1100px;margin:auto}.back{font:11px 'DM Mono';letter-spacing:.12em;color:#aaa}.detail-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:45px 0 25px}.detail-title{font-size:clamp(44px,9vw,110px);letter-spacing:-.08em;line-height:.9;margin:0}.detail-cover{height:min(58vw,570px);min-height:280px;background:#111;border:1px solid #333;display:flex;align-items:center;justify-content:center;overflow:hidden}.detail-cover .product-symbol{font-size:clamp(90px,18vw,220px)}.detail-cover img{width:100%;height:100%;object-fit:cover}.detail-info{display:grid;grid-template-columns:1fr 2fr;gap:30px;padding:35px 0;border-bottom:1px solid #444}.detail-info h3{font:11px 'DM Mono';letter-spacing:.15em}.detail-info p{color:#aaa;line-height:1.9;margin:0}.order-button{display:inline-flex;margin-top:25px;background:#e52b32;color:#fff;padding:15px 20px;font:11px 'DM Mono';letter-spacing:.12em}@media(max-width:600px){.detail{padding-top:30px}.detail-head{align-items:start;flex-direction:column}.detail-info{grid-template-columns:1fr;gap:10px}}</style></head><body><div class="grain"></div><header class="nav"><a class="brand-mark" href="index.html">G<span>®</span></a><nav><a href="index.html#home">HOME</a><a class="active" href="index.html#works">PRODUK</a><a href="index.html#about">KENAPA KAMI</a><a href="index.html#contact">BANTUAN</a></nav><div class="nav-right"><button id="themeToggle" class="icon-btn">☾</button><i class="divider"></i><span class="availability">DIGITAL STORE <b></b></span></div></header><main class="wrap detail"><a class="back" href="index.html#works">← KEMBALI KE PRODUK</a><div id="detail"></div></main><footer class="footer wrap"><span>© 2026 GITS STORE®.</span><div><a href="index.html#contact">BANTUAN</a> / <a href="admin.html">ADMIN ↗</a></div></footer><script src="app.js"></script><script>const id=new URLSearchParams(location.search).get('id'),p=readProjects().find(x=>x.id===id),root=document.getElementById('detail');if(!p)root.innerHTML='<h1>Produk tidak ditemukan.</h1><a class="text-link" href="index.html#works">LIHAT PRODUK ⟶</a>';else root.innerHTML=`<div class="detail-head"><div><p class="eyebrow">${escapeHtml(p.category)} / ${escapeHtml(p.year)}</p><h1 class="detail-title">${escapeHtml(p.title)}</h1></div><p class="mono muted">GITS STORE — DIGITAL GOODS</p></div><div class="detail-cover">${artMarkup(p)}</div><div class="detail-info"><h3>DETAIL PRODUK</h3><p>${escapeHtml(p.desc||'Hubungi admin untuk informasi produk.')}</p></div><div class="detail-info"><h3>HARGA / KETERSEDIAAN</h3><p><strong>${escapeHtml(p.price||'Hubungi admin')}</strong><br>Harga dan ketersediaan dapat berubah. Pastikan detail paket dikonfirmasi sebelum melakukan pembayaran.</p></div><a class="order-button" href="index.html#contact">TANYAKAN / PESAN PRODUK ↗</a>`;</script></body></html>
